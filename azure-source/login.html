<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DriveCast · Sign in</title><link rel="stylesheet" href="/panel.css"></head><body class="auth-page"><main class="card auth-card"><a class="logo" href="/"><span class="logo-mark">D</span>DriveCast</a><h1 id="authTitle">Your channels. One calm place.</h1><p class="muted" id="authSubtitle">Sign in to your private publishing workspace.</p><div class="auth-tabs" id="authTabs"><button class="active" data-mode="login">Sign in</button><button data-mode="signup">Create account</button></div><div id="authNotice" class="notice hidden" role="status"></div><form id="accountForm"><label id="emailLabel">Email address<input id="email" type="email" required autocomplete="email" maxlength="254"></label><label id="passwordLabel">Password<input id="password" type="password" required minlength="12" maxlength="256" autocomplete="current-password"></label><label id="otpLabel">Authenticator code (if enabled)<input id="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code"></label><button class="primary" type="submit" id="authSubmit">Sign in</button></form><button class="quiet" id="forgot">Forgot password?</button><button class="quiet hidden" id="resendVerification">Resend verification email</button><p class="help" id="authFoot">Your accounts, credentials and history stay in your own workspace.</p><a class="button hidden" id="localContinue" href="/#dashboard">Continue to local workspace</a></main><script nonce="__TOKEN__" src="/auth.js"></script></body></html>

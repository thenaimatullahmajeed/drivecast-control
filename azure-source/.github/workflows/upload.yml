name: DriveCast publishing

on:
  schedule:
    - cron: '17 * * * *'
    - cron: '37 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read-only source check; no uploads or file changes
        type: boolean
        default: true
      private_test:
        description: Optional private YouTube test; Facebook is never posted in this mode
        type: boolean
        default: false
      stats_only:
        description: Refresh recorded video and channel counters only
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: drivecast-publishing
  cancel-in-progress: false

jobs:
  upload:
    name: ${{ vars.CLIENT_NAME || github.event.repository.name }}
    if: github.event_name == 'workflow_dispatch' || vars.ENABLED == 'true' || github.event.schedule == '37 */6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SOURCE_TYPE: drive
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
      DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      FOLDER_ID: ${{ secrets.FOLDER_ID }}
      DRIVE_MAIN_FOLDER_ID: ${{ vars.DRIVE_MAIN_FOLDER_ID }}
      EXPECTED_CHANNEL_ID: ${{ vars.EXPECTED_CHANNEL_ID }}
      YOUTUBE_LEDGER_PATH: ${{ vars.YOUTUBE_LEDGER_PATH || 'records/ledger.json' }}
      MAX_UPLOADS_PER_DAY: ${{ vars.MAX_UPLOADS_PER_DAY || '2' }}
      UPLOAD_LIMIT: ${{ vars.MAX_UPLOADS_PER_DAY || '2' }}
      SCHEDULE_MODE: ${{ vars.SCHEDULE_MODE || 'interval' }}
      SCHEDULE_TIMEZONE: ${{ vars.SCHEDULE_TIMEZONE || 'America/Los_Angeles' }}
      SCHEDULE_WINDOWS: ${{ vars.SCHEDULE_WINDOWS || '12:00-14:00,18:00-21:00' }}
      PRIVACY: public
      FORCE_PUBLIC: 'true'
      CATEGORY_ID: ${{ vars.CATEGORY_ID || '22' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.dry_run) || vars.DRY_RUN || 'true' }}
      FORCE_PRIVATE: ${{ github.event_name == 'workflow_dispatch' && inputs.private_test && 'true' || 'false' }}
      STATS_ONLY: ${{ (github.event_name == 'schedule' && github.event.schedule == '37 */6 * * *') || (github.event_name == 'workflow_dispatch' && inputs.stats_only) }}
      SEO_MODE: basic
      CLIENT_NAME: ${{ vars.CLIENT_NAME || github.event.repository.name }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_SETTINGS: ${{ secrets.TELEGRAM_SETTINGS }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install official Google libraries
        run: python -m pip install -r requirements.txt
      - name: Publish new videos or refresh counters
        run: python worker.py

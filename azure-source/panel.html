<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="drivecast-token" content="__TOKEN__"><title>DriveCast</title><link rel="stylesheet" href="/panel.css"></head>
<body><div class="app"><aside id="sidebar"><a class="logo" href="/#dashboard"><span class="logo-mark">D</span>DriveCast</a><nav aria-label="Main navigation" id="navigation"></nav><div class="sidebar-foot"><span id="workspaceMode">Local workspace</span><button id="commandButton" class="quiet">Search anything <kbd>Ctrl K</kbd></button><button id="signOut" class="quiet hidden">Sign out</button></div></aside>
<div class="main"><div class="mobile-bar"><a class="logo" href="/#dashboard"><span class="logo-mark">D</span>DriveCast</a><button id="menuButton" aria-label="Open navigation" aria-expanded="false">☰</button></div><header><div><p id="eyebrow" class="eyebrow">Your publishing workspace</p><h1 id="heading">Command center</h1><p id="subtitle" class="muted"></p></div><div id="headerActions" class="row wrap"></div></header><section id="unlock" class="card hidden"><h2 id="unlockHeading">Unlock your saved connections</h2><p>Your backup uses this same unlock password. Keep it safe; it is separate from your sign-in password.</p><form id="unlockForm" class="row wrap"><label class="grow">Unlock password<input name="password" type="password" required minlength="12" autocomplete="current-password"></label><label class="check"><input name="remember" type="checkbox" checked> Remember on this device</label><button class="primary">Unlock</button></form></section>
<div id="job" class="notice hidden" aria-live="polite"></div><div id="toast" class="notice hidden" role="status"></div><main id="content" tabindex="-1"></main><footer><span id="freshness"></span><span>Connected → Prepared → Started → Verified Public</span></footer></div></div>
<dialog id="modal"><div class="dialog-head"><h2 id="modalTitle"></h2><button id="closeModal" class="icon-button" aria-label="Close dialog">×</button></div><div id="modalBody"></div></dialog><dialog id="palette"><div class="dialog-head"><h2>Go anywhere</h2><button id="closePalette" class="icon-button" aria-label="Close search">×</button></div><input id="paletteInput" type="search" placeholder="Page, channel or account…" aria-label="Search pages and channels"><div id="paletteResults"></div></dialog>
<script nonce="__TOKEN__" src="/panel.js"></script></body></html>
